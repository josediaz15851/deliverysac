<div class="login-container">
  <div class="login-box">
    <h1>DeliverySac</h1>
    <h2>Iniciar Sesión</h2>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="tu@email.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Cargando...' : 'Ingresar' }}
      </button>
    </form>

    <div class="demo-users">
      <p><strong>Usuarios de demo:</strong></p>
      <p>Admin: admin@deliverysac.com / password123</p>
      <p>Repartidor: repartidor@deliverysac.com / password123</p>
    </div>
  </div>
</div>
